name: Bug report
description: Report a reproducible problem in Redpact.
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Remove secrets and private data.
        For suspected vulnerabilities, request a private contact route from
        @wo658 without posting exploit details in a public issue.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example or commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Redpact version or commit, OS/architecture, desktop or server, and relevant Node/pnpm/Docker versions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Relevant errors and logs. Do not upload private settings, credentials, or entire runtime directories.
