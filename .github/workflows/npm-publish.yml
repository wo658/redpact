name: Publish npm runtime
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package (false performs a dry run)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify-npm:
    uses: ./.github/workflows/runtime-verification.yml
  publish:
    needs: verify-npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-runtime
          path: dist
      - run: node app/server/tools/runtime-artifact.mjs verify
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        if: ${{ inputs.publish }}
        run: node app/server/tools/publish-runtime.mjs
