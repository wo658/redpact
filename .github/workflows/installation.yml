name: Public installation verification
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'Formula/**'
      - 'tools/install/**'
      - '.github/workflows/installation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the public GitHub release
        run: sh install.sh --prefix "$RUNNER_TEMP/redpact"
      - name: Verify installed CLI, viewer and MCP
        run: node tools/install/smoke.mjs "$RUNNER_TEMP/redpact/bin/redpact"
      - name: Install directly with npm from GitHub
        run: npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/redpact-npm" https://github.com/wo658/redpact/releases/download/runtime-v0.1.0/redpact-0.1.0.tgz
      - name: Verify npm installation
        run: node tools/install/smoke.mjs "$RUNNER_TEMP/redpact-npm/bin/redpact"
      - name: Install from the public Homebrew tap
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          brew tap wo658/redpact https://github.com/wo658/redpact.git
          tap_root="$(brew --repo wo658/redpact)"
          git -C "$tap_root" fetch origin "$INSTALL_REF"
          git -C "$tap_root" checkout --detach FETCH_HEAD
          brew install wo658/redpact/redpact
          brew test wo658/redpact/redpact
          node tools/install/smoke.mjs "$(brew --prefix)/bin/redpact"
