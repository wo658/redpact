name: Verify release npm artifact
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server typecheck
      - run: pnpm test:package
      - run: pnpm --filter @redpact/server test
      - run: pnpm --filter @redpact/web test
      - run: node app/server/tools/runtime-artifact.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: npm-runtime
          path: |
            dist/redpact-*.tgz
            dist/runtime-artifact.json
          if-no-files-found: error
