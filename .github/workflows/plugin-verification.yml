name: Verify App Page Plugin
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Plugin using npm trusted publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/sidebar-app install --frozen-lockfile
      - run: pnpm --dir examples/sidebar-app pack:plugin
      - run: pnpm --dir examples/sidebar-app typecheck
      - run: pnpm --dir examples/sidebar-app test
      - run: pnpm --dir examples/sidebar-app test:package
      - run: pnpm --dir examples/sidebar-app exec playwright install chromium
      - run: pnpm --dir examples/sidebar-app test:browser
        env:
          REDPACT_TEST_RUNTIME: installed
          REDPACT_TEST_MANAGER: npm
      - run: pnpm --dir examples/sidebar-app test:browser
        env:
          REDPACT_TEST_RUNTIME: installed
          REDPACT_TEST_MANAGER: pnpm
      - uses: actions/upload-artifact@v4
        with:
          name: app-page-plugin
          path: |
            examples/sidebar-app/dist/wo658-redpact-plugin-*.tgz
            examples/sidebar-app/dist/plugin-artifact.json
            examples/sidebar-app/dist/redpact-evidence/
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'wo658/redpact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: app-page-plugin
          path: examples/sidebar-app/dist
      - run: node tools/plugins/publish.mjs --dry-run
      - name: Publish with npm trusted publishing
        if: ${{ inputs.publish }}
        run: node tools/plugins/publish.mjs
      - name: Verify published catalog version
        if: ${{ inputs.publish }}
        timeout-minutes: 5
        run: |
          for attempt in {1..20}; do
            if node tools/plugins/check-release.mjs --registry; then
              exit 0
            fi
            sleep 15
          done
          exit 1
