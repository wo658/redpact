name: Product release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  build:
    # Serialize uploads so the updater manifest retains both architectures.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release and configure native updater
        run: node app/desktop/tools/release-config.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-release.test.ts
      - name: Verify installed runtime package
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm test:package
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Redpact ${{ github.ref_name }}
          releaseBody: |
            Redpact ${{ github.ref_name }} adds project connection management with retained history, ordered runtime JSON migrations with original backups, and improved macOS sidebar controls and workspace navigation.

            Upgrade notes: supported legacy environment records are migrated automatically. Incomplete legacy selections block startup rather than guessing or resetting data. Project settings are not rewritten. Back up the complete instance before upgrading; downgrade requires restoring its matching backup while the application is stopped. Do not open upgraded data with an older application.

            Validation: server typecheck, 591 server tests, web tests/build, installed npm package verification, documentation content checks, and five Docker environment tests passed locally. The actual-application Playwright suite ran 26 scenarios: 12 passed and 14 failed. Failures include merge recovery, clipboard, sidebar/header expectations, ambiguous selectors, and workspace navigation/state expectations; these remain unresolved and this release is not fully UI-acceptance verified. The documentation renderer produced static pages but its wrapper did not exit, so renderer verification remains incomplete.

            macOS builds are ad-hoc signed and are not Apple notarized.

            Redpact ${{ github.ref_name }}은 기록을 보존하는 프로젝트 연결 관리, 원본 백업을 남기는 순차적 런타임 JSON 마이그레이션, 개선된 macOS 사이드바 컨트롤과 작업공간 탐색을 제공합니다.

            업그레이드 안내: 지원되는 이전 환경 레코드는 자동 변환됩니다. 이전 선택 정보가 불완전하면 추측하거나 데이터를 초기화하지 않고 시작을 차단합니다. 프로젝트 설정은 변경하지 않습니다. 업그레이드 전 인스턴스 전체를 백업하세요. 이전 버전으로 돌아가려면 앱을 중지한 상태에서 해당 버전의 백업을 복원해야 합니다. 업그레이드된 데이터를 이전 앱으로 열지 마세요.

            검증: 서버 타입 검사, 서버 테스트 591개, 웹 테스트·빌드, npm 설치 패키지 검증, 문서 내용 검사 및 Docker 환경 테스트 5개는 로컬에서 통과했습니다. 실제 앱 Playwright 시나리오 26개 중 12개가 통과하고 14개가 실패했습니다. 머지 복구, 클립보드, 사이드바·헤더 기대값, 중복 선택자, 작업공간 탐색·상태 기대값 관련 실패가 해결되지 않았으므로 UI 인수 검증을 모두 통과한 릴리스가 아닙니다. 문서 렌더러는 정적 페이지를 생성했지만 실행 래퍼가 종료되지 않아 렌더러 검증도 미완료입니다.

            macOS 빌드는 임시 서명되며 Apple 공증을 받지 않았습니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Package Intel app archive
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle=app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./app/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$bundle/dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Redpact.app" "$bundle/dmg/Redpact_${version}_x64.zip"
          gh release upload "$RELEASE_TAG" "$bundle/dmg/Redpact_${version}_x64.zip"
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install package and verify native launch, viewer and MCP
        if: runner.os == 'macOS'
        run: node app/desktop/tools/verify-dmg.mjs
      - name: Install Windows package and verify native launch, viewer and MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          ./app/desktop/tools/verify-windows.ps1 -Package $package.FullName

  publish-desktop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm lint
      - run: pnpm --filter @redpact/server typecheck
      - run: pnpm test:package
      - run: pnpm --filter @redpact/server test
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        run: node app/server/tools/publish-runtime.mjs
