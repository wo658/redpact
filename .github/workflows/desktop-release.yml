name: Product release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  verify-npm:
    uses: ./.github/workflows/runtime-verification.yml
  build:
    # Serialize uploads so the updater manifest retains both architectures.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release and configure native updater
        run: node app/desktop/tools/release-config.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-release.test.ts
      - name: Verify installed runtime package
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm test:package
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Redpact ${{ github.ref_name }} — Plugin updates and execution evidence
          releaseBody: |
            Adds Redpact plugin update checks and CLI installation for Codex and Claude Code using each installed marketplace. Includes personal/local marketplace support and Codex timestamp build comparison. Publishes plugin 0.2.0 through the repository catalogs, with Cursor packaging and Copilot installation guidance.

            Improves execution progress and readable result rows, screenshot thumbnail selection, workspace navigation labels, CLI startup URLs and current English/Korean documentation.

            No settings or storage migration is required from 0.6.1. Existing projects keep their fixed settings. Plugin installation does not update the app or an existing agent session: restart the agent session after installing. Other agents are not yet supported by the in-app updater; Cursor/Copilot packaging does not establish MCP Apps support.

            Publication waits for native desktop checks and npm installation verification. macOS builds are ad-hoc signed, not Apple notarized. Installation smoke tests do not cover every native WebView interaction or upgrades from every prior version.

            설치된 마켓플레이스를 기준으로 Codex·Claude Code의 Redpact 플러그인 업데이트 확인과 CLI 설치를 지원합니다. 개인·로컬 마켓플레이스와 Codex 날짜 빌드 비교를 포함하며, 저장소 카탈로그로 플러그인 0.2.0을 배포합니다. Cursor 패키지 구성과 Copilot 설치 안내도 추가합니다.

            실행 진행 상태와 읽기 쉬운 결과 행, 스크린샷 썸네일 선택, 작업공간 탐색 이름, CLI 시작 URL 및 최신 한영 문서를 개선합니다.

            0.6.1에서 설정·저장소 마이그레이션은 필요하지 않으며 기존 고정 설정을 유지합니다. 플러그인 설치는 앱이나 기존 에이전트 세션을 갱신하지 않으므로 설치 후 새 세션을 시작하세요. 앱 내 업데이트는 다른 에이전트를 아직 지원하지 않으며 Cursor·Copilot 패키지 구성은 MCP Apps 지원 검증을 뜻하지 않습니다.

            네이티브 데스크톱과 npm 설치 검증을 통과한 뒤 공개됩니다. macOS 빌드는 임시 서명되며 Apple 공증을 받지 않았습니다. 설치 스모크 검사는 모든 네이티브 WebView 동작이나 모든 이전 버전의 업데이트를 검증하지 않습니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Package Intel app archive
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle=app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./app/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$bundle/dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Redpact.app" "$bundle/dmg/Redpact_${version}_x64.zip"
          gh release upload "$RELEASE_TAG" "$bundle/dmg/Redpact_${version}_x64.zip"
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install package and verify native launch, viewer and MCP
        if: runner.os == 'macOS'
        run: node app/desktop/tools/verify-dmg.mjs
      - name: Install Windows package and verify native launch, viewer and MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          ./app/desktop/tools/verify-windows.ps1 -Package $package.FullName

  publish-desktop:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  publish-npm:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-runtime
          path: dist
      - run: node app/server/tools/runtime-artifact.mjs verify
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        run: node app/server/tools/publish-runtime.mjs
