name: Product release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  verify-npm:
    uses: ./.github/workflows/runtime-verification.yml
  build:
    # Serialize uploads so the updater manifest retains both architectures.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release and configure native updater
        run: node app/desktop/tools/release-config.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-release.test.ts
      - name: Verify installed runtime package
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm test:package
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Redpact ${{ github.ref_name }} — Installation and desktop reliability
          releaseBody: |
            Fixes macOS npm installation by bundling the existing optional fsevents prebuilt package. Adds Windows titlebar controls and improves native navigation and responsive workspace layouts. Release publication now waits for native desktop checks and npm installation checks across four OS/architecture environments on Node 24 and 26.

            No settings or storage migration is required.

            Release artifacts are verified before publication. See this tag's Actions run for source checks, npm installation results and native desktop installation results.

            macOS builds are ad-hoc signed, not Apple notarized. Installation smoke checks do not cover every WebView control, Docker execution or upgrades from a previous release.

            기존 선택적 fsevents 사전 빌드 패키지를 번들해 macOS npm 설치 오류를 수정합니다. Windows 창 제어 버튼과 네이티브 탐색·반응형 작업공간 레이아웃을 개선합니다. 이제 네이티브 데스크톱 검사와 4개 OS/아키텍처 환경의 Node 24·26 npm 설치 검사가 모두 성공해야 공개됩니다.

            설정·저장소 마이그레이션은 필요하지 않습니다.

            릴리스 아티팩트는 공개 전에 검증됩니다. 소스 검사, npm 설치 및 네이티브 데스크톱 설치 결과는 이 태그의 Actions 실행을 확인하세요.

            macOS 빌드는 임시 서명되며 Apple 공증을 받지 않았습니다. 설치 스모크 검사는 모든 WebView 제어, Docker 실행, 이전 버전으로부터의 업데이트를 검증하지 않습니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Package Intel app archive
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle=app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./app/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$bundle/dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Redpact.app" "$bundle/dmg/Redpact_${version}_x64.zip"
          gh release upload "$RELEASE_TAG" "$bundle/dmg/Redpact_${version}_x64.zip"
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install package and verify native launch, viewer and MCP
        if: runner.os == 'macOS'
        run: node app/desktop/tools/verify-dmg.mjs
      - name: Install Windows package and verify native launch, viewer and MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          ./app/desktop/tools/verify-windows.ps1 -Package $package.FullName

  publish-desktop:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  publish-npm:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-runtime
          path: dist
      - run: node app/server/tools/runtime-artifact.mjs verify
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        run: node app/server/tools/publish-runtime.mjs
