name: Product release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  verify-npm:
    uses: ./.github/workflows/runtime-verification.yml
  build:
    # Serialize uploads so the updater manifest retains both architectures.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release and configure native updater
        run: node app/desktop/tools/release-config.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-release.test.ts
      - name: Verify installed runtime package
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm test:package
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Redpact ${{ github.ref_name }} — Environment values and container execution
          releaseBody: |
            Redpact 0.8.0 · Beta simplifies environment values to explicit strings and delegates Docker runtime access, Compose startup and container lifecycle operations to Testcontainers. Fixes service aliases and Integration runner network discovery.

            Breaking settings/API change from 0.7.0: manually replace secret references and typed host/port/URL bindings in .redpact/settings.json with explicit strings. The separate credential store, credential HTTP endpoints and request_keys MCP tool are removed. Omitted defaults and explicit application unsets remain supported. Values are plaintext in settings and captured evidence; execution text masks nonempty values, and browser traces are omitted when values are present. Screenshots and video are not sanitized.

            Startup migration 002-flat-environment-values preserves original runtime records and converts historical bindings using captured values. Missing historical private-secrets snapshots block startup: restore the matching snapshot from a backup before retrying. Back up the complete instance before upgrading if rollback is required. Project settings are not rewritten automatically; no reset is required for valid, migratable records.

            Publication requires native desktop checks and the npm installation matrix on Linux, macOS and Windows with Node 24 and 26. macOS builds are ad-hoc signed, not Apple notarized. Installation checks do not cover every native WebView interaction or every prior-version upgrade.

            Redpact 0.8.0 · Beta는 환경값을 명시적 문자열로 단순화하고 Docker 런타임 접근, Compose 시작 및 컨테이너 수명주기 처리를 Testcontainers에 위임합니다. 서비스 별칭과 Integration 실행기 네트워크 탐색을 수정합니다.

            0.7.0 대비 설정·API 호환성 변경: .redpact/settings.json의 비밀값 참조와 형식화된 host/port/URL 바인딩을 명시적 문자열로 직접 바꾸세요. 별도 자격 증명 저장소, 자격 증명 HTTP 엔드포인트와 request_keys MCP 도구는 제거됩니다. 생략된 기본값과 애플리케이션 변수의 명시적 unset은 유지됩니다. 설정과 캡처된 증거에는 값이 평문으로 남습니다. 실행 텍스트에서는 비어 있지 않은 값을 가리고, 값이 있으면 브라우저 trace를 저장하지 않습니다. 스크린샷과 영상의 값은 가리지 않습니다.

            시작 시 002-flat-environment-values 마이그레이션이 원본 런타임 기록을 보존하고 캡처된 값으로 과거 바인딩을 변환합니다. 과거 private-secrets 스냅샷이 없으면 시작이 차단되므로 백업에서 해당 스냅샷을 복원한 뒤 재시도하세요. 롤백이 필요하면 업그레이드 전에 전체 인스턴스를 백업하세요. 프로젝트 설정은 자동 변환하지 않으며, 유효하고 변환 가능한 기록은 초기화할 필요가 없습니다.

            네이티브 데스크톱 검사와 Linux·macOS·Windows의 Node 24·26 npm 설치 검증을 통과한 뒤 공개됩니다. macOS 빌드는 임시 서명되며 Apple 공증을 받지 않았습니다. 설치 검사는 모든 네이티브 WebView 동작이나 모든 이전 버전의 업그레이드를 검증하지 않습니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Package Intel app archive
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle=app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./app/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$bundle/dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Redpact.app" "$bundle/dmg/Redpact_${version}_x64.zip"
          gh release upload "$RELEASE_TAG" "$bundle/dmg/Redpact_${version}_x64.zip"
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install package and verify native launch, viewer and MCP
        if: runner.os == 'macOS'
        run: node app/desktop/tools/verify-dmg.mjs
      - name: Install Windows package and verify native launch, viewer and MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          ./app/desktop/tools/verify-windows.ps1 -Package $package.FullName

  publish-desktop:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  publish-npm:
    needs: [build, verify-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-runtime
          path: dist
      - run: node app/server/tools/runtime-artifact.mjs verify
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        run: node app/server/tools/publish-runtime.mjs
