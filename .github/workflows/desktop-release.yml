name: Product release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  build:
    # Serialize uploads so the updater manifest retains both architectures.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release and configure native updater
        run: node app/desktop/tools/release-config.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm docs:check
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-release.test.ts
      - name: Verify installed runtime package
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm test:package
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Redpact ${{ github.ref_name }}
          releaseBody: |
            Redpact ${{ github.ref_name }} adds Compose web hosting and separate browser test runners, improves fixed dependency configuration and MCP cards, and refines workspace location headers, navigation, and active tabs in both themes.

            Validation on the release source: 606 server tests, 307 web tests, six managed integration cases, 30 actual-application browser cases, and 12 capture scenarios passed. The installed runtime package, server typecheck, lint, documentation content checks, and webpack documentation rendering passed. The default Turbopack documentation build failed with a local port-binding permission error; webpack rendering was verified separately. Opt-in tests excluded from the standard server suite are not claimed as passed.

            Project settings retain the fixed shared configuration contract. This release introduces no new runtime storage migration. macOS builds are ad-hoc signed and are not Apple notarized.

            Redpact ${{ github.ref_name }}은 Compose 웹 호스팅과 분리된 브라우저 테스트 실행기를 추가하고, 고정 의존성 설정과 MCP 카드를 개선하며, 작업공간 위치 헤더·탐색·라이트 및 다크 테마의 활성 탭 표시를 다듬습니다.

            릴리스 소스 검증: 서버 테스트 606개, 웹 테스트 307개, 관리형 통합 시나리오 6개, 실제 앱 브라우저 기능 시나리오 30개, 캡처 시나리오 12개가 통과했습니다. 설치 패키지, 서버 타입 검사, lint, 문서 내용 검사 및 webpack 문서 렌더링도 통과했습니다. 기본 Turbopack 문서 빌드는 로컬 포트 바인딩 권한 오류로 실패했고 webpack 렌더링을 별도로 검증했습니다. 기본 서버 테스트에서 제외된 선택 실행 테스트는 통과했다고 주장하지 않습니다.

            프로젝트 설정은 기존의 고정 공유 설정 계약을 유지하며 이번 릴리스에 새로운 런타임 저장소 마이그레이션은 없습니다. macOS 빌드는 임시 서명되며 Apple 공증을 받지 않았습니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Package Intel app archive
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle=app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./app/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$bundle/dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Redpact.app" "$bundle/dmg/Redpact_${version}_x64.zip"
          gh release upload "$RELEASE_TAG" "$bundle/dmg/Redpact_${version}_x64.zip"
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install package and verify native launch, viewer and MCP
        if: runner.os == 'macOS'
        run: node app/desktop/tools/verify-dmg.mjs
      - name: Install Windows package and verify native launch, viewer and MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          ./app/desktop/tools/verify-windows.ps1 -Package $package.FullName

  publish-desktop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm lint
      - run: pnpm --filter @redpact/server typecheck
      - run: pnpm test:package
      - run: pnpm --filter @redpact/server test
      - name: Inspect publish contents
        run: node app/server/tools/publish-runtime.mjs --dry-run
      - name: Publish using npm trusted publishing
        run: node app/server/tools/publish-runtime.mjs
