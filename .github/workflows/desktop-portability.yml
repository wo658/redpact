name: Windows and Linux desktop verification
on:
  push:
    branches: [codex/windows-linux-desktop]
    paths: ['app/desktop/**', 'app/server/tools/**', '.github/workflows/desktop-portability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri -> ../node_modules/.redpact/target
          cache-on-failure: true
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev xvfb dbus-x11
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm --filter @redpact/server exec vitest run test/desktop-platform.test.ts
      - run: pnpm --filter @redpact/desktop exec tauri build --target ${{ matrix.target }} --config src-tauri/tauri.preview.conf.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/deb/*.deb
            app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Native tests and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Install and verify Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/deb/*.deb
          dpkg -L redpact
          xvfb-run -a dbus-run-session -- node app/desktop/tools/verify-dmg.mjs /usr/bin/redpact-desktop /usr/lib/Redpact/runtime
          sudo apt-get remove -y redpact
          test ! -f /usr/bin/redpact-desktop
      - name: Install and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app/desktop/node_modules/.redpact/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'redpact-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          Get-ChildItem $destination
          node app/desktop/tools/verify-dmg.mjs "$destination/redpact-desktop.exe" "$destination/runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows app verification failed' }
          $uninstall = Start-Process -FilePath "$destination/uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path "$destination/redpact-desktop.exe"); $attempt++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$destination/redpact-desktop.exe") { throw 'Uninstaller left the app executable behind' }
