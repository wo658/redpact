services:
  app:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    ports:
      - "54318"
      - "54319"
      - "54320"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:54318/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30
