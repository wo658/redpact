interface:
  display_name: "Redpact Init"
  short_description: "Configure and validate a project for Redpact"
  default_prompt: "Use $redpact-init to initialize this project for local Redpact."

dependencies:
  tools:
    - type: "mcp"
      value: "redpact"
      description: "Redpact runtime status, shutdown and viewer URL"
      transport: "streamable_http"
      url: "http://127.0.0.1:54321/mcp"
